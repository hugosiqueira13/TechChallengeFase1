# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        pip install -e ".[dev]"
    - name: Build package
      run: |
        python -m build --sdist --wheel
    - name: Lint with ruff
      run: |
        python -m ruff check src tests
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=term-missing --ignore=tests/smoke_test.py
    - name: Run ML tests
      id: ml_test
      run: |
        python -m pytest tests/test_mlp.py -v
    - name: Deploy API
      if: steps.ml_test.outcome == 'success'
      run: |
        echo "ML quality passed, iniciando deploy da API"
        # Substitua o comando abaixo pelo deploy real da sua API.
        # Ex: ./deploy.sh, az webapp deploy, gcloud app deploy, etc.
